# Server Configuration
server.port=8080

# Local H2 Database Configuration (works without Docker/PostgreSQL)
spring.datasource.url=jdbc:h2:mem:servermonitor;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 console for local inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Enable scheduling for metrics simulator
spring.task.scheduling.pool.size=2
